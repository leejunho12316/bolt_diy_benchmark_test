<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SaaS 클린 블루 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--brand:#2563EB;--soft:#EFF4FF;--tint:#F5F8FF;--ink:#0F172A;--ink2:#475569;--ink3:#94A3B8;--line:#E2E8F0}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;color:var(--ink);background:#fff;word-break:keep-all}
.c{max-width:1160px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}header .c{height:68px;display:flex;align-items:center;gap:32px}
.logo{font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}.logo i{width:24px;height:24px;border-radius:7px;background:var(--brand);display:block}
nav{display:flex;gap:28px;font-size:15px;color:var(--ink2);margin-right:auto}
.btn{height:42px;padding:0 18px;border-radius:8px;display:inline-flex;align-items:center;font-weight:600;font-size:15px}.pri{background:var(--brand);color:#fff}.sec{border:1px solid var(--line);background:#fff}
.hero{background:var(--tint);text-align:center;padding:52px 0 0}
.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--brand)}.badge i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
h1{font-size:54px;line-height:1.15;letter-spacing:-.03em;margin:20px auto 16px;max-width:15em}
.lead{font-size:19px;color:var(--ink2);margin:0 0 28px}.ctas{display:flex;gap:12px;justify-content:center}.ctas .btn{height:48px;padding:0 22px}
.mock{margin:40px auto 0;width:900px;height:250px;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;box-shadow:0 8px 24px rgba(15,23,42,.06);display:grid;grid-template-columns:180px 1fr;overflow:hidden;text-align:left}
.mock aside{background:#F8FAFC;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}.mock aside span{height:10px;border-radius:5px;background:var(--line)}.mock aside span:first-child{background:var(--soft);height:28px}
.mock main{padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}.k{border:1px solid var(--line);border-radius:12px;padding:14px}.k small{color:var(--ink3);font-size:12px}.k b{display:block;font-size:22px;margin-top:6px}
.bar{grid-column:1/-1;height:110px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:flex-end;gap:14px;padding:14px}.bar span{flex:1;background:var(--soft);border-top:3px solid var(--brand);border-radius:4px 4px 0 0}
</style>
</head>
<body>
<header><div class="c"><div class="logo"><i></i>플로우데스크</div><nav><span>기능</span><span>요금제</span><span>고객사례</span><span>문서</span></nav><span style="font-size:15px;color:#475569">로그인</span><span class="btn pri">무료로 시작</span></div></header>
<section class="hero"><div class="c">
<span class="badge"><i></i>새 기능: 자동 업무 배정 →</span>
<h1>흩어진 업무 요청을 한 화면에서 처리하세요</h1>
<p class="lead">메일·메신저·폼으로 들어온 요청을 자동으로 모아 담당자에게 배정합니다.</p>
<div class="ctas"><span class="btn pri">무료로 시작</span><span class="btn sec">데모 신청</span></div>
<div class="mock"><aside><span></span><span></span><span></span><span></span><span></span></aside><main><div class="k"><small>오늘 접수</small><b>[지표]</b></div><div class="k"><small>처리 완료</small><b>[지표]</b></div><div class="k"><small>평균 응답</small><b>[지표]</b></div><div class="bar"><span style="height:40%"></span><span style="height:65%"></span><span style="height:50%"></span><span style="height:80%"></span><span style="height:70%"></span><span style="height:95%"></span><span style="height:60%"></span></div></main></div>
</div></section>
</body>
</html>
