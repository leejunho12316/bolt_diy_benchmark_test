<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내추럴 그린 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap">
<style>
:root{--bg:#F4EFE6;--sf:#FBF8F2;--sage:#C9D5B9;--sage2:#E3EAD9;--fo:#2F4A36;--fo2:#1F3325;--ink2:#5B6B5E;--clay:#C27C5A;--line:#DCD3C3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fo2);font-family:"Pretendard Variable",Pretendard,sans-serif;word-break:keep-all;overflow:hidden}
.sr{font-family:"Gowun Batang",serif;font-weight:700}
.c{max-width:1140px;margin:0 auto;padding:0 24px}
header .c{height:76px;display:flex;align-items:center;gap:28px}.logo{font-size:24px;color:var(--fo);margin-right:auto;display:flex;align-items:center;gap:8px}.logo i{width:22px;height:22px;background:var(--fo);border-radius:0 70% 0 70%;display:block}
nav{display:flex;gap:26px;font-size:15px;font-weight:500}
.btn{height:48px;padding:0 24px;border-radius:999px;background:var(--fo);color:var(--sf);display:inline-flex;align-items:center;font-weight:600;font-size:15px}.btn2{background:transparent;color:var(--fo);border:1.5px solid var(--fo);margin-left:10px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:24px 0 34px}
.eb{font-size:14px;font-weight:600;color:var(--fo)}h1{font-size:52px;line-height:1.25;color:var(--fo);margin:12px 0 16px}.body{font-size:17px;line-height:1.8;margin:0 0 26px}
.peb{height:320px;background:var(--sage);border-radius:60% 40% 55% 45%/50% 60% 40% 50%;position:relative}
.peb:after{content:"";position:absolute;inset:60px 90px;background:var(--sage2);border-radius:40% 60% 45% 55%/55% 45% 60% 40%}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.v{display:flex;gap:14px;align-items:center;background:var(--sf);border-radius:18px;padding:18px 20px;box-shadow:0 6px 20px rgba(47,74,54,.08)}
.v i{width:46px;height:46px;border-radius:50%;background:var(--sage2);flex:none;display:grid;place-items:center}.v i:after{content:"";width:16px;height:16px;border:1.75px solid var(--fo);border-radius:0 70% 0 70%}
.v b{display:block;font-size:17px;color:var(--fo)}.v span{font-size:14px;color:var(--ink2)}
.badge{display:inline-block;background:var(--sage2);color:var(--fo);border-radius:999px;font-size:13px;font-weight:600;padding:5px 12px;margin-right:6px;margin-bottom:18px}
</style>
</head>
<body>
<header><div class="c"><div class="logo sr"><i></i>숲결</div><nav><span>제품</span><span>클래스</span><span>이야기</span><span>장바구니</span></nav><span class="btn">정기 구독</span></div></header>
<div class="c">
<section class="hero"><div><span class="badge">무농약 원료</span><span class="badge">재활용 포장</span><div class="eb">자연에서 온 하루 루틴</div><h1 class="sr">몸과 집을 위한<br>조용한 습관</h1><p class="body">제주 허브로 만든 천연 비누와 요가 클래스를 함께 만나보세요. 매달 새로운 계절 키트가 도착합니다.</p><span class="btn">제품 보기</span><span class="btn btn2">클래스 예약</span></div><div class="peb"></div></section>
<div class="vals"><div class="v"><i></i><div><b>자연 유래 성분</b><span>합성 향료 없이 만들어요</span></div></div><div class="v"><i></i><div><b>플라스틱 프리</b><span>종이와 유리로만 포장해요</span></div></div><div class="v"><i></i><div><b>지역 농가 상생</b><span>제주 농가와 직거래해요</span></div></div></div>
</div>
</body>
</html>
