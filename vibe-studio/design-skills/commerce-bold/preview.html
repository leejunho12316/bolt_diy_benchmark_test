<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>커머스 볼드 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
:root{--s2:#F5F5F7;--ink:#111318;--ink2:#5A5F6B;--ink3:#9A9FAA;--line:#E7E8EC;--cta:#E8222E;--navy:#14213D;--star:#FFB400;--ok:#12A150}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Pretendard Variable",Pretendard,sans-serif;word-break:keep-all;overflow:hidden;font-variant-numeric:tabular-nums}
.c{max-width:1240px;margin:0 auto;padding:0 20px}
.top{background:var(--s2);font-size:12px;color:var(--ink2)}.top .c{height:34px;display:flex;align-items:center;justify-content:space-between}
.hd .c{height:78px;display:flex;align-items:center;gap:40px}.logo{font-size:28px;font-weight:900;color:var(--cta);letter-spacing:-.04em}
.search{flex:1;max-width:520px;height:48px;border:2px solid var(--cta);border-radius:999px;display:flex;align-items:center;padding:0 20px;color:var(--ink3);font-size:15px}
.icons{margin-left:auto;display:flex;gap:22px;font-size:14px;font-weight:600}.cart{position:relative}.cart b{position:absolute;right:-14px;top:-10px;background:var(--cta);color:#fff;font-size:11px;border-radius:999px;width:18px;height:18px;display:grid;place-items:center}
.cat{border-bottom:1px solid var(--line)}.cat .c{height:50px;display:flex;gap:30px;align-items:center;font-size:15px;font-weight:600}.cat .on{border-bottom:2px solid var(--ink);padding:13px 0}
.banner{margin-top:20px;background:var(--navy);border-radius:14px;height:210px;display:flex;align-items:center;justify-content:space-between;padding:0 48px;color:#fff;overflow:hidden}
.banner h2{font-size:38px;margin:0 0 10px;line-height:1.2}.banner p{margin:0 0 18px;opacity:.7;font-size:14px}.cta{background:var(--cta);color:#fff;height:44px;padding:0 22px;border-radius:8px;font-weight:700;display:inline-flex;align-items:center}
.bimg{display:flex;gap:16px}.bimg span{width:130px;height:130px;border-radius:12px;background:rgba(255,255,255,.12)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 14px}.sec h3{margin:0;font-size:22px;font-weight:800}.sec span{font-size:14px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.img{aspect-ratio:1;border-radius:8px;background:var(--s2);margin-bottom:10px;position:relative}.img:after{content:"";position:absolute;inset:26%;border-radius:12px;background:#E3E4E9}
.nm{font-size:14px;line-height:1.45;margin-bottom:6px}.pr{font-size:17px;font-weight:800}.pr em{color:var(--cta);font-style:normal;margin-right:6px}
</style>
</head>
<body>
<div class="top"><div class="c"><span>오늘 밤 12시 전 주문 시 내일 도착</span><span>고객센터 · 로그인 · 회원가입</span></div></div>
<div class="hd"><div class="c"><span class="logo">마켓온</span><div class="search">찾고 싶은 상품을 검색해 보세요</div><div class="icons"><span>찜</span><span class="cart">장바구니<b>3</b></span></div></div></div>
<div class="cat"><div class="c"><span>☰ 전체</span><span class="on">신상</span><span>베스트</span><span>세일</span><span>리빙</span><span>주방</span><span>패션</span><span>식품</span></div></div>
<div class="c">
<div class="banner"><div><h2>가을 리빙 위크<br>최대 50% 할인</h2><p>10.08 – 10.15 · 무료배송</p><span class="cta">기획전 보러가기</span></div><div class="bimg"><span></span><span></span><span></span></div></div>
<div class="sec"><h3>오늘의 특가</h3><span>더보기 ›</span></div>
<div class="grid">
<div><div class="img"></div><div class="nm">무지 린넨 쿠션 커버 45×45</div><div class="pr"><em>32%</em>12,900원</div></div>
<div><div class="img"></div><div class="nm">스테인리스 텀블러 500ml</div><div class="pr"><em>25%</em>17,800원</div></div>
<div><div class="img"></div><div class="nm">원목 도마 미디엄</div><div class="pr"><em>40%</em>21,000원</div></div>
<div><div class="img"></div><div class="nm">세라믹 머그 2개 세트</div><div class="pr"><em>18%</em>15,500원</div></div>
<div><div class="img"></div><div class="nm">극세사 이불 퀸</div><div class="pr"><em>50%</em>39,000원</div></div>
</div></div>
</body>
</html>
