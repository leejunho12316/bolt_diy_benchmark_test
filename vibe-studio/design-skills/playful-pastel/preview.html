<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>플레이풀 파스텔 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{--bg:#FFFBF5;--ink:#2E2A4F;--ink2:#5D5880;--line:#ECE6F5;--p:#6C5CE7;--pd:#4B3CC4;--peach:#FFE3D6;--mint:#D8F5E8;--sky:#DCEBFF;--lilac:#EDE3FF;--sun:#FFD45C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,sans-serif;word-break:keep-all;overflow:hidden}
.r{font-family:Jua,sans-serif;font-weight:400}
.c{max-width:1120px;margin:0 auto;padding:0 24px}
header .c{height:76px;display:flex;align-items:center;gap:30px}.logo{font-size:26px;display:flex;align-items:center;gap:10px;margin-right:auto}.logo i{width:30px;height:30px;border-radius:50%;background:var(--p);display:block;box-shadow:inset -6px -6px 0 var(--pd)}
nav{display:flex;gap:26px;font-weight:600}
.btn{height:50px;padding:0 26px;border-radius:999px;background:var(--p);color:#fff;font-weight:700;display:inline-flex;align-items:center;box-shadow:0 3px 0 var(--pd)}.btn2{background:#fff;color:var(--p);border:2px solid var(--line);box-shadow:none;margin-left:12px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:26px 0 30px}
h1{font-size:52px;line-height:1.2;margin:0 0 16px}.lead{font-size:18px;line-height:1.7;color:var(--ink2);margin:0 0 28px}
.ill{height:300px;border-radius:28px;background:var(--lilac);position:relative;overflow:hidden}
.ill b{position:absolute;border-radius:50%}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.card{border-radius:28px;padding:24px;height:196px}.card i{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-style:normal;font-size:22px;margin-bottom:14px}
.card h3{margin:0 0 6px;font-size:21px}.card p{margin:0;font-size:14px;color:var(--ink2)}
</style>
</head>
<body>
<header><div class="c"><div class="logo r"><i></i>꼬마코딩</div><nav><span>수업</span><span>선생님</span><span>후기</span><span>공지</span></nav><span class="btn">무료 체험</span></div></header>
<div class="c">
<section class="hero"><div><h1 class="r">놀면서 배우는<br>첫 번째 코딩 교실</h1><p class="lead">블록을 맞추다 보면 어느새 게임이 완성돼요. 초등학생을 위한 소규모 코딩 수업입니다.</p><span class="btn">수업 둘러보기</span><span class="btn btn2">상담 신청</span></div>
<div class="ill"><b style="width:180px;height:180px;background:var(--sun);left:60px;top:50px"></b><b style="width:120px;height:120px;background:var(--sky);right:50px;top:30px"></b><b style="width:220px;height:220px;background:var(--mint);right:-40px;bottom:-80px"></b><b style="width:90px;height:90px;background:var(--peach);left:30px;bottom:24px"></b></div></section>
<div class="cards">
<div class="card" style="background:var(--peach)"><i>▲</i><h3 class="r">블록 코딩</h3><p>8~10세 · 주 1회</p></div>
<div class="card" style="background:var(--mint)"><i>●</i><h3 class="r">게임 만들기</h3><p>10~12세 · 주 2회</p></div>
<div class="card" style="background:var(--sky)"><i>■</i><h3 class="r">로봇 교실</h3><p>9~12세 · 주말</p></div>
<div class="card" style="background:var(--lilac)"><i>★</i><h3 class="r">방학 캠프</h3><p>전 연령 · 5일</p></div>
</div></div>
</body>
</html>
