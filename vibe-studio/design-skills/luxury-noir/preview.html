<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프리미엄 블랙&골드 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
:root{--noir:#0D0C0B;--n2:#171513;--iv:#F2EBDD;--iv2:#B8AF9F;--gold:#C9A96E;--gold2:#E2C892;--line:rgba(201,169,110,.28)}
*{box-sizing:border-box}body{margin:0;background:var(--noir);color:var(--iv);font-family:"Pretendard Variable",Pretendard,sans-serif;word-break:keep-all;overflow:hidden}
.s{font-family:"Cormorant Garamond","Noto Serif KR",serif;font-weight:400}
.lab{font-size:12px;letter-spacing:.3em;color:var(--gold);font-weight:500}
.c{max-width:1120px;margin:0 auto;padding:0 32px}
header .c{height:88px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
header .r{justify-self:end}.logo{font-size:30px;letter-spacing:.24em}
.hero{text-align:center;padding:46px 0 40px}
h1{font-size:68px;line-height:1.12;margin:22px 0 18px;font-family:"Noto Serif KR",serif;font-weight:400}
.body{color:var(--iv2);font-size:16px;line-height:1.9;margin:0 0 34px}
.ghost{display:inline-flex;align-items:center;height:52px;padding:0 38px;border:1px solid var(--gold);color:var(--gold);font-size:12px;letter-spacing:.3em;border-radius:2px}
.rule{width:40px;height:1px;background:var(--gold);margin:44px auto 0}
.split{display:grid;grid-template-columns:6fr 5fr;gap:56px;align-items:center;margin-top:44px}
.img{height:230px;background:radial-gradient(circle at 50% 55%,#3A2F22,#171513 70%);position:relative}
.img:after{content:"";position:absolute;left:50%;top:50%;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 14px #1E1A16,inset 0 0 0 15px var(--line)}
.menu div{display:flex;align-items:baseline;gap:12px;padding:12px 0}.menu b{font-family:"Noto Serif KR",serif;font-weight:500;font-size:19px}.menu i{flex:1;border-bottom:1px dotted var(--line)}.menu span{color:var(--gold2);font-size:19px}
</style>
</head>
<body>
<header><div class="c"><span class="lab">MENU&nbsp;&nbsp;&nbsp;&nbsp;STORY</span><span class="s logo">LUMIÈRE</span><span class="lab r">RESERVE ──</span></div></header>
<div class="c">
<section class="hero"><div class="lab">SEOUL · SINCE 2014</div><h1>계절이 머무는 저녁,<br>단 열두 자리</h1><p class="body">제철 식재료로 매달 새롭게 구성하는 테이스팅 코스를 선보입니다.</p><span class="ghost">RESERVATION</span><div class="rule"></div></section>
<div class="split"><div class="img"></div><div class="menu"><div class="lab" style="margin-bottom:8px">AUTUMN COURSE</div><div><b>송이와 한우 콘소메</b><i></i><span class="s">I</span></div><div><b>들기름에 구운 금태</b><i></i><span class="s">II</span></div><div><b>무화과 타르트</b><i></i><span class="s">III</span></div></div></div>
</div>
</body>
</html>
