<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미니멀 모노크롬 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--ink:#0A0A0A;--ink2:#5C5C5C;--ink3:#9A9A9A;--line:#E5E5E5}
*{box-sizing:border-box}body{margin:0;font-family:"Pretendard Variable",Pretendard,sans-serif;color:var(--ink);background:#fff;word-break:keep-all}
.c{max-width:1200px;margin:0 auto;padding:0 40px}
header{border-bottom:1px solid var(--line)}header .c{height:72px;display:flex;align-items:center;justify-content:space-between}
.mark{font-weight:700;letter-spacing:.06em;font-size:16px}nav{display:flex;gap:32px;font-size:15px;font-weight:500}nav span:first-child{text-decoration:underline;text-underline-offset:6px}
.hero{padding:96px 0 72px;display:grid;grid-template-columns:3fr 9fr;gap:24px}
.meta{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink3);letter-spacing:.04em}
h1{margin:0;font-size:92px;line-height:1;letter-spacing:-.045em;font-weight:700;max-width:9.5em}
.lead{margin:32px 0 0;font-size:18px;line-height:1.7;color:var(--ink2);max-width:34em}
.row{display:grid;grid-template-columns:80px 1fr 220px 80px 40px;align-items:center;height:76px;border-top:1px solid var(--line);font-size:20px;font-weight:600}
.row:last-child{border-bottom:1px solid var(--line)}.row .cat{font-size:15px;font-weight:400;color:var(--ink2)}.row .arr{text-align:right}
.row.hover{background:#F6F6F6}
</style>
</head>
<body>
<header><div class="c"><div class="mark">ATELIER MONO</div><nav><span>Work</span><span>About</span><span>Contact ↗</span></nav></div></header>
<div class="c">
<section class="hero"><div class="meta">SEOUL — EST. 2019</div><div><h1>형태보다 여백으로 말합니다.</h1><p class="lead">브랜드 아이덴티티와 디지털 제품을 만드는 작은 디자인 스튜디오입니다. 필요한 것만 남기는 일을 합니다.</p></div></section>
<div class="row"><span class="meta">01</span><span>온도 — 커피 브랜드 리뉴얼</span><span class="cat">Brand Identity</span><span class="meta">2026</span><span class="arr">→</span></div>
<div class="row hover"><span class="meta">02</span><span>Field Notes 웹 매거진</span><span class="cat">Web Design</span><span class="meta">2025</span><span class="arr">→</span></div>
<div class="row"><span class="meta">03</span><span>소도시 서점 지도 앱</span><span class="cat">Product</span><span class="meta">2025</span><span class="arr">→</span></div>
</div>
</body>
</html>
